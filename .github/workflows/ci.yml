name: GrowthMCP CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile package
        run: python -m compileall -q growthmcp

      - name: Run tests
        run: pytest

  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run MCP protocol smoke test
        run: pytest -m e2e tests/test_mcp_smoke.py

  branding-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check removed hosted branding
        run: |
          if grep -RniE 'pipeboard|pipeboard\.co|mcp\.pipeboard' growthmcp assets server.json pyproject.toml; then
            echo "Found upstream hosted-service branding in project files."
            exit 1
          fi
