[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growthmcp"
version = "0.1.0"
description = "AI-powered marketing intelligence and Meta Ads MCP"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Lokeshwar Sudam", email = "lokeshwarsudam@gmail.com"},
]
keywords = ["growth", "marketing", "meta", "facebook", "ads", "mcp"]
license = {text = "BUSL-1.1"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.26.0",
    "mcp[cli]==1.28.1",
    "starlette>=1.0.1",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "Pillow>=10.0.0",
    "pathlib>=1.0.1",
    "python-dateutil>=2.8.2",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Lokeshwar2005/ai-growth-analytics-mcp"
Bug Tracker = "https://github.com/Lokeshwar2005/ai-growth-analytics-mcp/issues"

[project.scripts]
growthmcp = "growthmcp:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["growthmcp"]

[tool.pytest.ini_options]
markers = [
    "e2e: marks tests as end-to-end (requires running MCP server) - excluded from default runs",
]
addopts = "-v --strict-markers -m 'not e2e'"
testpaths = ["tests"]
asyncio_mode = "auto"
